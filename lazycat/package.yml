package: cloud.lazycat.app.mygomusic
version: 0.1.36
name: MyGo Music
description: A music player for the folders on your netdisk, which finds lyrics as it plays.
author: yigiaogiao
# LPK v2 needs lzcos 1.5.0; nothing here asks for more.
min_os_version: 1.5.0
# The netdisk is the user's document root (/lzcapp/run/mnt/home), granted by
# document.read; media.read covers the /lzcapp/media fallback. LRCLib needs
# the internet. The platform asks the user to approve these.
permissions:
  required:
    - document.read
    - media.read
    - net.internet
license: AGPL-3.0-only
homepage: https://github.com/yigiaogiao/mygo-music
locales:
  zh-CN:
    name: MyGo 音乐
    description: 播放懒猫网盘里的音乐，没有歌词的歌会自动到 LRCLib 寻找。
  en-US:
    name: MyGo Music
    description: Play the music in your LazyCat netdisk; songs without lyrics find them at LRCLib.
