<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141416" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>MyGo Music</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #101014;
    overscroll-behavior: none;
  }
  /* The app draws inside the safe area, so the notch and the home indicator
     never cover its controls. */
  #mygo {
    position: fixed;
    top: env(safe-area-inset-top, 0px);
    right: env(safe-area-inset-right, 0px);
    bottom: env(safe-area-inset-bottom, 0px);
    left: env(safe-area-inset-left, 0px);
    overflow: hidden;
    background: #101014;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  #boot {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: grid;
    place-items: center;
    gap: 14px;
    align-content: center;
    padding: 24px;
    color: #f2f2f5;
    background: #101014;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    text-align: center;
  }
  #boot .name { font-size: 19px; font-weight: 700; letter-spacing: -0.2px; }
  #boot .hint { color: #9a9aa6; font-size: 12.5px; max-width: 360px; }
  #boot.error .hint { color: #f2b8c6; }
  /* The page around the app shows through a safe area's room, and in the
     browser's own bar: light around a light app, rather than a black edge. */
  @media (prefers-color-scheme: light) {
    html, body, #mygo, #boot { background: #ffffff; }
    #boot { color: #1d1d1f; }
    #boot .hint { color: #6e6e73; }
    #boot.error .hint { color: #b3264a; }
  }
</style>
</head>
<body>
<div id="mygo"></div>
<div id="boot"><div class="name">MyGo Music</div><div class="hint">Loading…</div></div>
<script src="wasm_exec.js"></script>
<script>
  (async () => {
    const boot = document.getElementById('boot');
    const hint = boot.querySelector('.hint');
    const fail = (err) => {
      boot.classList.add('error');
      hint.textContent = 'Could not start MyGo Music: ' + (err && err.message ? err.message : err);
      console.error(err);
    };
    if (!window.Go) {
      fail(new Error('wasm_exec.js did not load'));
      return;
    }
    const go = new Go();
    try {
      let instance;
      if (WebAssembly.instantiateStreaming) {
        try {
          const result = await WebAssembly.instantiateStreaming(fetch('app.wasm'), go.importObject);
          instance = result.instance;
        } catch (e) {
          // Some servers send the wasm as application/octet-stream.
          const buf = await (await fetch('app.wasm')).arrayBuffer();
          instance = (await WebAssembly.instantiate(buf, go.importObject)).instance;
        }
      } else {
        const buf = await (await fetch('app.wasm')).arrayBuffer();
        instance = (await WebAssembly.instantiate(buf, go.importObject)).instance;
      }
      // MyGo appends its canvas to #mygo when the app opens.
      const reveal = () => {
        if (document.querySelector('#mygo canvas')) {
          boot.remove();
        } else {
          requestAnimationFrame(reveal);
        }
      };
      reveal();
      go.run(instance).catch(fail);
    } catch (e) {
      fail(e);
    }
  })();
</script>
</body>
</html>
